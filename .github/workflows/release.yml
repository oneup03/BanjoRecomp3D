name: release
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release
  cancel-in-progress: false

env:
  N64RECOMP_COMMIT: 2b6f05688de2abc7d86da5b4a89b84c2c6acbabe
  SDL2_VERSION: 2.30.3
  FLATPAK_ID: io.github.banjorecomp.banjorecomp
  FREEDESKTOP_VERSION: 25.08
  LLVM_VERSION: 20

jobs:
  recomp:
    runs-on: ubuntu-22.04
    outputs:
      sha_short: ${{ steps.vars.outputs.sha_short }}
    steps:
      - name: Compute short SHA
        id: vars
        run: echo "sha_short=${GITHUB_SHA::7}" >> $GITHUB_OUTPUT

  build-windows:
    needs: recomp
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: ccache
        uses: hendrikmuhs/ccache-action@v1.2
        with:
          key: ${{ github.job }}-${{ env.N64RECOMP_COMMIT }}

      - name: Clone deps
        shell: bash
        env:
          DEPS_FETCH: ${{ secrets.DEPS_FETCH }}
          DEPS_EXTRACT: ${{ secrets.DEPS_EXTRACT }}
        run: |
          eval "${DEPS_FETCH}"
          eval "${DEPS_EXTRACT}"

      - name: Install Ninja
        run: choco install ninja --no-progress --limit-output

      - name: Download portable LLVM
        shell: pwsh
        run: |
          $ProgressPreference = 'SilentlyContinue'
          New-Item -ItemType Directory -Path portable-llvm -Force | Out-Null
          Invoke-WebRequest -Uri "https://github.com/llvm/llvm-project/releases/download/llvmorg-19.1.3/LLVM-19.1.3-Windows-X64.tar.xz" -OutFile LLVM.tar.xz
          7z x LLVM.tar.xz -bso0 -bsp0
          7z x LLVM.tar "-oportable-llvm" -bso0 -bsp0
          Remove-Item LLVM.tar, LLVM.tar.xz -ErrorAction SilentlyContinue

      - name: Configure MSVC Developer Command Prompt
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64

      - name: Build N64Recomp & RSPRecomp
        shell: pwsh
        run: |
          git clone https://github.com/Mr-Wiseguy/N64Recomp.git --recurse-submodules N64RecompSource
          cd N64RecompSource
          git checkout $env:N64RECOMP_COMMIT
          git submodule update --init --recursive
          $cpuCores = (Get-CimInstance -ClassName Win32_Processor).NumberOfLogicalProcessors
          cmake -DCMAKE_BUILD_TYPE=Release -DCMAKE_MAKE_PROGRAM=ninja -G Ninja -S . -B cmake-build
          cmake --build cmake-build --config Release --target N64RecompCLI -j $cpuCores
          cmake --build cmake-build --config Release --target RSPRecomp -j $cpuCores
          Copy-Item cmake-build\N64Recomp.exe ..\
          Copy-Item cmake-build\RSPRecomp.exe ..\

      - name: Run N64Recomp & RSPRecomp
        shell: pwsh
        run: |
          .\N64Recomp.exe banjo.us.rev0.toml
          .\RSPRecomp.exe n_aspMain.us.rev0.toml

      - name: Configure CMake
        shell: pwsh
        run: |
          $env:PATH = ($env:PATH -split ';' | Where-Object { $_ -ne 'C:\Program Files\LLVM\bin' }) -join ';'
          cmake -G Ninja -DCMAKE_BUILD_TYPE=Release -DCMAKE_C_COMPILER_LAUNCHER=ccache -DCMAKE_CXX_COMPILER_LAUNCHER=ccache `
            -DCMAKE_C_COMPILER=clang-cl -DCMAKE_CXX_COMPILER=clang-cl `
            -DPATCHES_C_COMPILER="..\portable-llvm\LLVM-19.1.3-Windows-X64\bin\clang.exe" `
            -DPATCHES_LD="..\portable-llvm\LLVM-19.1.3-Windows-X64\bin\ld.lld.exe" `
            -S . -B build-cmake

      - name: Build BanjoRecompiled
        shell: pwsh
        run: |
          $env:PATH = ($env:PATH -split ';' | Where-Object { $_ -ne 'C:\Program Files\LLVM\bin' }) -join ';'
          cmake --build build-cmake --target BanjoRecompiled --config Release

      - name: Stage artifacts
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Path package -Force | Out-Null
          Copy-Item build-cmake\BanjoRecompiled.exe package\
          Copy-Item build-cmake\dxcompiler.dll       package\
          Copy-Item build-cmake\dxil.dll             package\
          Copy-Item build-cmake\SDL2.dll             package\
          Copy-Item recompcontrollerdb.txt           package\
          Copy-Item -Recurse assets                  package\assets

      - name: Create zip
        shell: pwsh
        run: |
          Compress-Archive -Path package\* -DestinationPath "BanjoRecompiled3D-windows-${{ needs.recomp.outputs.sha_short }}.zip" -Force

      - name: Upload release artifact
        uses: actions/upload-artifact@v4
        with:
          name: release-windows
          path: BanjoRecompiled3D-windows-${{ needs.recomp.outputs.sha_short }}.zip
          if-no-files-found: error

  build-linux-x64:
    needs: recomp
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: ccache
        uses: hendrikmuhs/ccache-action@v1.2
        with:
          key: ${{ github.job }}-${{ env.N64RECOMP_COMMIT }}

      - name: Clone deps
        shell: bash
        env:
          DEPS_FETCH: ${{ secrets.DEPS_FETCH }}
          DEPS_EXTRACT: ${{ secrets.DEPS_EXTRACT }}
        run: |
          eval "${DEPS_FETCH}"
          eval "${DEPS_EXTRACT}"

      - name: Install Linux deps
        run: |
          sudo apt-get update
          sudo apt-get install -y ninja-build libgtk-3-dev lld llvm clang-15 g++-11 gcc-11 wget

      - name: Build SDL2 from source
        run: |
          wget -q https://github.com/libsdl-org/SDL/releases/download/release-${SDL2_VERSION}/SDL2-${SDL2_VERSION}.tar.gz
          tar -xzf SDL2-${SDL2_VERSION}.tar.gz
          cd SDL2-${SDL2_VERSION}
          ./configure
          make -j $(nproc)
          sudo make install
          sudo cp -av /usr/local/lib/libSDL* /lib/x86_64-linux-gnu/

      - name: Build N64Recomp & RSPRecomp
        run: |
          git clone https://github.com/Mr-Wiseguy/N64Recomp.git --recurse-submodules N64RecompSource
          cd N64RecompSource
          git checkout $N64RECOMP_COMMIT
          git submodule update --init --recursive
          cmake -DCMAKE_BUILD_TYPE=Release -DCMAKE_CXX_COMPILER=g++-11 -DCMAKE_C_COMPILER=gcc-11 -DCMAKE_MAKE_PROGRAM=ninja -G Ninja -S . -B cmake-build
          cmake --build cmake-build --config Release --target N64RecompCLI -j $(nproc)
          cmake --build cmake-build --config Release --target RSPRecomp -j $(nproc)
          cp cmake-build/N64Recomp ..
          cp cmake-build/RSPRecomp ..

      - name: Run N64Recomp & RSPRecomp
        run: |
          chmod +x N64Recomp RSPRecomp
          ./N64Recomp banjo.us.rev0.toml
          ./RSPRecomp n_aspMain.us.rev0.toml

      - name: Build BanjoRecompiled
        run: |
          cmake -DCMAKE_BUILD_TYPE=Release -DCMAKE_C_COMPILER_LAUNCHER=ccache -DCMAKE_CXX_COMPILER_LAUNCHER=ccache \
            -DCMAKE_CXX_COMPILER=clang++-15 -DCMAKE_C_COMPILER=clang-15 \
            -DPATCHES_C_COMPILER=clang-15 -DPATCHES_LD=ld.lld-15 \
            -DCMAKE_MAKE_PROGRAM=ninja -G Ninja -S . -B build-cmake
          cmake --build build-cmake --config Release --target BanjoRecompiled -j $(nproc)

      - name: Create tarball
        run: |
          mv build-cmake/BanjoRecompiled BanjoRecompiled
          tar -czf "BanjoRecompiled3D-linux-x64-${{ needs.recomp.outputs.sha_short }}.tar.gz" \
            BanjoRecompiled assets/ recompcontrollerdb.txt

      - name: Upload release artifact
        uses: actions/upload-artifact@v4
        with:
          name: release-linux-x64
          path: BanjoRecompiled3D-linux-x64-${{ needs.recomp.outputs.sha_short }}.tar.gz
          if-no-files-found: error

  build-linux-arm64:
    needs: recomp
    runs-on: ubuntu-22.04-arm
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: ccache
        uses: hendrikmuhs/ccache-action@v1.2
        with:
          key: ${{ github.job }}-${{ env.N64RECOMP_COMMIT }}

      - name: Clone deps
        shell: bash
        env:
          DEPS_FETCH: ${{ secrets.DEPS_FETCH }}
          DEPS_EXTRACT: ${{ secrets.DEPS_EXTRACT }}
        run: |
          eval "${DEPS_FETCH}"
          eval "${DEPS_EXTRACT}"

      - name: Install Linux deps
        run: |
          sudo apt-get update
          sudo apt-get install -y ninja-build libgtk-3-dev lld llvm clang-15 g++-11 gcc-11 wget

      - name: Build SDL2 from source
        run: |
          wget -q https://github.com/libsdl-org/SDL/releases/download/release-${SDL2_VERSION}/SDL2-${SDL2_VERSION}.tar.gz
          tar -xzf SDL2-${SDL2_VERSION}.tar.gz
          cd SDL2-${SDL2_VERSION}
          ./configure
          make -j $(nproc)
          sudo make install
          sudo cp -av /usr/local/lib/libSDL* /lib/aarch64-linux-gnu/

      - name: Build N64Recomp & RSPRecomp
        run: |
          git clone https://github.com/Mr-Wiseguy/N64Recomp.git --recurse-submodules N64RecompSource
          cd N64RecompSource
          git checkout $N64RECOMP_COMMIT
          git submodule update --init --recursive
          cmake -DCMAKE_BUILD_TYPE=Release -DCMAKE_CXX_COMPILER=g++-11 -DCMAKE_C_COMPILER=gcc-11 -DCMAKE_MAKE_PROGRAM=ninja -G Ninja -S . -B cmake-build
          cmake --build cmake-build --config Release --target N64RecompCLI -j $(nproc)
          cmake --build cmake-build --config Release --target RSPRecomp -j $(nproc)
          cp cmake-build/N64Recomp ..
          cp cmake-build/RSPRecomp ..

      - name: Run N64Recomp & RSPRecomp
        run: |
          chmod +x N64Recomp RSPRecomp
          ./N64Recomp banjo.us.rev0.toml
          ./RSPRecomp n_aspMain.us.rev0.toml

      - name: Build BanjoRecompiled
        run: |
          cmake -DCMAKE_BUILD_TYPE=Release -DCMAKE_C_COMPILER_LAUNCHER=ccache -DCMAKE_CXX_COMPILER_LAUNCHER=ccache \
            -DCMAKE_CXX_COMPILER=clang++-15 -DCMAKE_C_COMPILER=clang-15 \
            -DCMAKE_MAKE_PROGRAM=ninja -G Ninja -S . -B build-cmake
          cmake --build build-cmake --config Release --target BanjoRecompiled -j $(nproc)

      - name: Create tarball
        run: |
          mv build-cmake/BanjoRecompiled BanjoRecompiled
          tar -czf "BanjoRecompiled3D-linux-arm64-${{ needs.recomp.outputs.sha_short }}.tar.gz" \
            BanjoRecompiled assets/ recompcontrollerdb.txt

      - name: Upload release artifact
        uses: actions/upload-artifact@v4
        with:
          name: release-linux-arm64
          path: BanjoRecompiled3D-linux-arm64-${{ needs.recomp.outputs.sha_short }}.tar.gz
          if-no-files-found: error

  build-linux-flatpak:
    needs: recomp
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Clone deps
        shell: bash
        env:
          DEPS_FETCH: ${{ secrets.DEPS_FETCH }}
          DEPS_EXTRACT: ${{ secrets.DEPS_EXTRACT }}
        run: |
          eval "${DEPS_FETCH}"
          eval "${DEPS_EXTRACT}"

      - name: Install Linux deps
        run: |
          sudo apt-get update
          sudo apt-get install -y flatpak-builder lld

      - name: Prepare Flatpak runtime/SDK
        run: |
          flatpak --user remote-add --if-not-exists flathub https://flathub.org/repo/flathub.flatpakrepo
          flatpak --user install -y flathub org.freedesktop.Sdk//${FREEDESKTOP_VERSION}
          flatpak --user install -y flathub org.freedesktop.Sdk.Extension.llvm${LLVM_VERSION}//${FREEDESKTOP_VERSION}

      - name: Build Flatpak bundle
        run: |
          git config --global protocol.file.allow always
          make -C patches CC=clang LD=ld.lld
          flatpak-builder --user --force-clean --install-deps-from=flathub --repo=repo builddir ./flatpak/${FLATPAK_ID}.json
          flatpak build-bundle repo "BanjoRecompiled3D-flatpak-${{ needs.recomp.outputs.sha_short }}.flatpak" ${FLATPAK_ID} --runtime-repo=https://flathub.org/repo/flathub.flatpakrepo

      - name: Upload release artifact
        uses: actions/upload-artifact@v4
        with:
          name: release-flatpak
          path: BanjoRecompiled3D-flatpak-${{ needs.recomp.outputs.sha_short }}.flatpak
          if-no-files-found: error

  build-macos:
    needs: recomp
    runs-on: macos-14
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: ccache
        uses: hendrikmuhs/ccache-action@v1.2
        with:
          key: ${{ github.job }}-${{ env.N64RECOMP_COMMIT }}

      - name: Clone deps
        shell: bash
        env:
          DEPS_FETCH: ${{ secrets.DEPS_FETCH }}
          DEPS_EXTRACT: ${{ secrets.DEPS_EXTRACT }}
        run: |
          eval "${DEPS_FETCH}"
          eval "${DEPS_EXTRACT}"

      - name: Homebrew Setup
        run: |
          brew install ninja
          brew uninstall --ignore-dependencies libpng freetype || true

      - name: MacPorts Setup
        uses: melusina-org/setup-macports@v1
        with:
          parameters: '.github/macos/macports.yaml'

      - name: Build N64Recomp & RSPRecomp
        run: |
          git clone https://github.com/Mr-Wiseguy/N64Recomp.git --recurse-submodules N64RecompSource
          cd N64RecompSource
          git checkout $N64RECOMP_COMMIT
          git submodule update --init --recursive
          cmake -DCMAKE_BUILD_TYPE=Release -DCMAKE_MAKE_PROGRAM=ninja -G Ninja -S . -B cmake-build
          cmake --build cmake-build --config Release --target N64Recomp -j $(sysctl -n hw.ncpu)
          cmake --build cmake-build --config Release --target RSPRecomp -j $(sysctl -n hw.ncpu)
          cp cmake-build/N64Recomp ..
          cp cmake-build/RSPRecomp ..

      - name: Run N64Recomp & RSPRecomp
        run: |
          chmod +x N64Recomp RSPRecomp
          ./N64Recomp banjo.us.rev0.toml
          ./RSPRecomp n_aspMain.us.rev0.toml

      - name: Build BanjoRecompiled
        run: |
          cmake -DCMAKE_BUILD_TYPE=Release -DCMAKE_C_COMPILER_LAUNCHER=ccache -DCMAKE_CXX_COMPILER_LAUNCHER=ccache \
            -DCMAKE_MAKE_PROGRAM=ninja -G Ninja -S . -B build-cmake \
            -DPATCHES_LD=/opt/local/bin/ld.lld-mp-18 \
            -DCMAKE_AR=/opt/local/bin/llvm-ar-mp-18 \
            -DPATCHES_C_COMPILER=/opt/local/bin/clang-mp-18 \
            -DCMAKE_OSX_ARCHITECTURES="x86_64;arm64"
          cmake --build build-cmake --config Release --target BanjoRecompiled -j $(sysctl -n hw.ncpu)

      - name: Package .app
        run: |
          mv build-cmake/BanjoRecompiled.app BanjoRecompiled.app
          zip -r -y "BanjoRecompiled3D-macos-${{ needs.recomp.outputs.sha_short }}.zip" BanjoRecompiled.app

      - name: Upload release artifact
        uses: actions/upload-artifact@v4
        with:
          name: release-macos
          path: BanjoRecompiled3D-macos-${{ needs.recomp.outputs.sha_short }}.zip
          if-no-files-found: error

  build-3ds:
    name: Nintendo 3DS
    needs: recomp
    runs-on: ubuntu-latest
    # devkitPro's image (Debian 12): devkitARM, libctru, citro3d, picasso and
    # 3dstools, with DEVKITPRO/DEVKITARM exported. devkitPro asks that CI use
    # its images rather than pacman.
    container: devkitpro/devkitarm:latest
    # Steps in a container job run under sh unless a shell is named
    # (actions/runner#1533), and sh rejects `set -o pipefail`.
    defaults:
      run:
        shell: bash
    env:
      # makerom and bannertool are not devkitPro packages, and their release
      # binaries need a newer glibc than the image has, so both are built
      # from pinned release tags.
      MAKEROM_SRC: https://github.com/3DSGuy/Project_CTR/archive/refs/tags/makerom-v0.19.0.tar.gz
      BANNERTOOL_SRC: https://github.com/carstene1ns/3ds-bannertool/archive/refs/tags/1.2.3.tar.gz
    steps:
      # Before the checkout, which needs git for the submodules. clang-15 and
      # lld-15 build the MIPS patches and the built-in mods, as in the Linux
      # (x64) job; 7z is for Clone deps, unzip opens the game modes'
      # packages, and the host tools (N64Recomp, mod_bake) need a C++20
      # compiler, CMake and Ninja. Named even where the image has them.
      - name: Install 3DS build deps
        run: |
          apt-get update
          apt-get install -y --no-install-recommends git clang-15 lld-15 ccache p7zip-full unzip zip curl \
            ca-certificates cmake ninja-build g++ make

      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive

      # The built-in mods' sources are submodules with update = none (the
      # desktop build never needs them); only their own tree, not theirs.
      - name: Checkout the built-in mods
        run: |
          git config --global --add safe.directory '*'
          git submodule update --init --checkout platform/3ds/mods

      - name: ccache
        uses: hendrikmuhs/ccache-action@v1.2
        with:
          key: ${{ github.job }}-${{ env.N64RECOMP_COMMIT }}

      - name: Clone deps
        env:
          DEPS_FETCH: ${{ secrets.DEPS_FETCH }}
          DEPS_EXTRACT: ${{ secrets.DEPS_EXTRACT }}
        run: |
          eval "${DEPS_FETCH}"
          eval "${DEPS_EXTRACT}"

      - name: Build CIA tools
        run: |
          set -euo pipefail
          mkdir -p /tmp/ciatools/makerom /tmp/ciatools/bannertool
          cd /tmp/ciatools
          curl -fsSL "$MAKEROM_SRC" | tar -xz --strip-components=1 -C makerom
          make -C makerom/makerom -j"$(nproc)" deps >/dev/null
          make -C makerom/makerom -j"$(nproc)" >/dev/null
          install -m 755 makerom/makerom/bin/makerom /usr/local/bin/makerom
          curl -fsSL "$BANNERTOOL_SRC" | tar -xz --strip-components=1 -C bannertool
          cmake -S bannertool -B bannertool/build -G Ninja -DCMAKE_BUILD_TYPE=Release >/dev/null
          cmake --build bannertool/build >/dev/null
          install -m 755 bannertool/build/bannertool /usr/local/bin/bannertool

      # The 3DS build uses the runtime's own N64Recomp
      # (lib/N64ModernRuntime/N64Recomp) after rt64-3ds's patch series is
      # applied to the runtime, which the patch series commits on a local
      # branch: hence the identity. host-tools also builds RecompModTool and
      # rt64-3ds's mod_bake.
      - name: Build N64Recomp, RSPRecomp and the mod tools
        run: |
          git config --global user.name "github-actions"
          git config --global user.email "github-actions@users.noreply.github.com"
          make -C platform/3ds nmr-patch host-tools

      # Builds the patches, the built-in mods (from their sources) and fetches
      # the game modes' pinned packages (checked by SHA-256; only their code
      # is used), bakes them all, then recompiles the game and the patches.
      - name: Run N64Recomp & RSPRecomp
        run: make -C platform/3ds codegen PATCH_CC=clang-15 LLD=ld.lld-15

      - name: Build BanjoRecompiled3DS
        env:
          CMAKE_C_COMPILER_LAUNCHER: ccache
          CMAKE_CXX_COMPILER_LAUNCHER: ccache
        run: make -C platform/3ds cia

      # The zip is laid out from the SD card's root (3ds/BanjoRecomp/ with
      # the .3dsx, where the player's ROM goes too); the CIA ships on its
      # own. The Homebrew Launcher lists a folder's .3dsx when it has the
      # folder's name: BanjoRecomp.3dsx. make_game_mod_rom.py sits at the
      # zip's root: run there, it takes the game modes' .nrm files beside it
      # and the ROM in 3ds/BanjoRecomp/, and writes their ROMs into
      # 3ds/BanjoRecomp/mods/ (README "Game modes").
      - name: Package
        run: |
          set -euo pipefail
          out=package/3ds/BanjoRecomp
          mkdir -p "$out"
          cp build-3ds/BanjoRecompiled3DS.3dsx "$out/BanjoRecomp.3dsx"
          cp platform/3ds/README.md "$out/"
          cp lib/rt64-3ds/tools/make_game_mod_rom.py package/
          (cd package && zip -q -r "../BanjoRecompiled3D-3ds-${{ needs.recomp.outputs.sha_short }}.zip" 3ds make_game_mod_rom.py)
          cp build-3ds/BanjoRecompiled3DS.cia "BanjoRecompiled3D-3ds-${{ needs.recomp.outputs.sha_short }}.cia"

      - name: Upload release artifact
        uses: actions/upload-artifact@v4
        with:
          name: release-3ds
          path: |
            BanjoRecompiled3D-3ds-${{ needs.recomp.outputs.sha_short }}.zip
            BanjoRecompiled3D-3ds-${{ needs.recomp.outputs.sha_short }}.cia
          if-no-files-found: error

  publish:
    needs: [build-windows, build-linux-x64, build-linux-arm64, build-linux-flatpak, build-macos, build-3ds]
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - name: Download release artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: release-*
          path: dist
          merge-multiple: true

      # A QR code of the 3DS CIA's download link, for FBI's "Remote Install >
      # Scan QR Code": shown in the release notes and kept as an asset. This
      # job doesn't need recomp, so the CIA is found by its name's pattern.
      - name: Make the 3DS CIA's QR code
        run: |
          sudo apt-get install -y --no-install-recommends qrencode
          cia=$(cd dist && ls ./*-3ds-*.cia | head -1)
          cia=${cia#./}
          if [ -z "$cia" ]; then echo "no 3DS CIA in dist/" >&2; exit 1; fi
          qrencode -o dist/BanjoRecompiled3D-3ds-QR.png -s 8 -m 2 \
            "https://github.com/$GITHUB_REPOSITORY/releases/download/rolling/$cia"

      - name: Publish rolling release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          {
            echo "Built from $GITHUB_SHA"
            echo
            echo "### Nintendo 3DS"
            echo
            echo "Scan with FBI (Remote Install > Scan QR Code) to install the CIA:"
            echo
            echo "![QR code for the 3DS CIA](https://github.com/$GITHUB_REPOSITORY/releases/download/rolling/BanjoRecompiled3D-3ds-QR.png)"
          } > notes.md
          gh release delete rolling --yes --cleanup-tag --repo "$GITHUB_REPOSITORY" 2>/dev/null || true
          gh release create rolling dist/* \
            --repo "$GITHUB_REPOSITORY" \
            --title "Rolling Release" \
            --notes-file notes.md
